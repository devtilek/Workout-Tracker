spring:
  application:
    name: workout-tracker

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workout_tracker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-32-chars-minimum}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
