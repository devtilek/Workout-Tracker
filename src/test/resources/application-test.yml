spring:
  datasource:
    url: jdbc:h2:mem:workout_tracker_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-key-that-is-at-least-32-characters-long
    expiration-ms: 60000
